name: 🔥 深度分析 v6（一份推送）

on:
  # schedule:
  #   - cron: '30 10 * * 1-5'  # 已暂停定时推送

  workflow_dispatch:
    inputs:
      stock_list:
        description: '股票代码（逗号分隔，留空使用默认9只）'
        required: false
        default: ''
      skip_push:
        description: '跳过微信推送'
        required: false
        default: false
        type: boolean

concurrency:
  group: daily-stock-analysis
  cancel-in-progress: false

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 随机延迟
        run: sleep $((RANDOM % 30))

      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -i https://pypi.tuna.tsinghua.edu.cn/simple akshare pandas numpy

      - name: 执行分析
        env:
          STOCK_LIST: ${{ github.event.inputs.stock_list || vars.ENHANCED_STOCK_LIST || '601899,000426,002714,000582,688063,688122,09868,01810,01788' }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          REPORT_DIR: reports
        run: |
          echo "📊 股票深度分析增强系统 v6"
          echo "⏰ $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          echo "📈 $STOCK_LIST"
          if [ "${{ github.event.inputs.skip_push }}" = "true" ]; then
            PUSHPLUS_TOKEN=0 python stock_enhanced.py
          else
            python stock_enhanced.py
          fi

      - name: 上传报告
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stock-reports-${{ github.run_number }}
          path: reports/
          retention-days: 30
